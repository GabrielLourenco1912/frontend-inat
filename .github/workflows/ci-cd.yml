name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  RELEASE_ARCHIVE: "inat-frontend-release.tar.gz"

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create standalone release
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          tar -czf "$RELEASE_ARCHIVE" -C release .

      - name: Upload release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: inat-frontend-release
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: inat-frontend-release

      - name: Prepare SSH
        run: |
          test -n "$SSH_HOST" || (echo "Missing SSH_HOST secret" >&2 && exit 1)
          test -n "$SSH_USER" || (echo "Missing SSH_USER secret" >&2 && exit 1)
          test -n "$SSH_PRIVATE_KEY" || (echo "Missing SSH_PRIVATE_KEY secret" >&2 && exit 1)

          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=${DEPLOY_PATH:-/var/www/inat-frontend}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=${SERVICE_NAME:-inat-frontend}" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to server
        run: |
          remote_archive="/tmp/inat-frontend-${GITHUB_SHA}.tar.gz"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' && rm -f '$remote_archive'"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "$RELEASE_ARCHIVE" \
            "$SSH_USER@$SSH_HOST:$remote_archive"

      - name: Activate release
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SERVICE_NAME='$SERVICE_NAME' RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          archive="/tmp/inat-frontend-${RELEASE_SHA}.tar.gz"
          release_dir="${DEPLOY_PATH}/releases/${RELEASE_SHA}"

          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          ln -sfn "$release_dir" "${DEPLOY_PATH}/current"
          rm -f "$archive"

          if command -v pm2 >/dev/null 2>&1; then
            cd "${DEPLOY_PATH}/current"
            pm2 restart "$SERVICE_NAME" || pm2 start server.js --name "$SERVICE_NAME"
            pm2 save
          elif command -v systemctl >/dev/null 2>&1; then
            sudo systemctl restart "$SERVICE_NAME"
          else
            echo "No pm2 or systemctl available to restart ${SERVICE_NAME}." >&2
            exit 1
          fi
          REMOTE
